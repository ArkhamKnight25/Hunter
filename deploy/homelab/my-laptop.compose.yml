# ─────────────────────────────────────────────────────────────────────────
# MY LAPTOP BACKEND COMPOSE  (Vercel frontend + laptop backend, no domain)
# ─────────────────────────────────────────────────────────────────────────
# Runs the backend only. Frontend lives on Vercel; it reaches Django through a
# Cloudflare Tunnel pointed at this laptop's published Django port (8000).
#
#   docker compose --env-file my-laptop.env -f my-laptop.compose.yml up -d
#
# Then expose Django publicly (no domain needed):
#   cloudflared tunnel --url http://localhost:8000
# Copy the printed https://*.trycloudflare.com URL into:
#   - Vercel env  BACKEND_INTERNAL_URL = that URL
#   - this env    JOBHUNT_ALLOWED_HOSTS += that host

services:
  mysql:
    image: mysql:8.0
    container_name: jobhunt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${JOBHUNT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${JOBHUNT_MYSQL_DATABASE}
      MYSQL_USER: ${JOBHUNT_MYSQL_USER}
      MYSQL_PASSWORD: ${JOBHUNT_MYSQL_PASSWORD}
    volumes:
      - ${JOBHUNT_MYSQL_DATA_LOCATION}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobhunt-redis
    restart: unless-stopped
    volumes:
      - ${JOBHUNT_REDIS_DATA_LOCATION}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    image: ${JOBHUNT_IMAGE}:${JOBHUNT_TAG}
    container_name: jobhunt-django
    restart: unless-stopped
    # Publish Django so the Cloudflare Tunnel (on the host) can reach it.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_MODE: web
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${JOBHUNT_MYSQL_DATABASE}
      MYSQL_USER: ${JOBHUNT_MYSQL_USER}
      MYSQL_PASSWORD: ${JOBHUNT_MYSQL_PASSWORD}
      DJANGO_SECRET_KEY: ${JOBHUNT_DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${JOBHUNT_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${JOBHUNT_CSRF_TRUSTED_ORIGINS}
      APIFY_API_TOKEN: ${JOBHUNT_APIFY_API_TOKEN}
      OPENAI_API_KEY: ${JOBHUNT_OPENAI_API_KEY:-}
      # Comma-separated pool — rotates to the next key when one is exhausted/rate-limited.
      OPENAI_API_KEYS: ${JOBHUNT_OPENAI_API_KEYS:-}
      DISCORD_WEBHOOK_URL: ${JOBHUNT_DISCORD_WEBHOOK_URL}
      DISCORD_TOP_N_JOBS: ${JOBHUNT_DISCORD_TOP_N_JOBS}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/jobs/stats/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  celery-worker:
    image: ${JOBHUNT_IMAGE}:${JOBHUNT_TAG}
    container_name: jobhunt-celery-worker
    restart: unless-stopped
    environment:
      APP_MODE: celery-worker
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${JOBHUNT_MYSQL_DATABASE}
      MYSQL_USER: ${JOBHUNT_MYSQL_USER}
      MYSQL_PASSWORD: ${JOBHUNT_MYSQL_PASSWORD}
      DJANGO_SECRET_KEY: ${JOBHUNT_DJANGO_SECRET_KEY}
      DJANGO_API_URL: http://django:8000
      APIFY_API_TOKEN: ${JOBHUNT_APIFY_API_TOKEN}
      OPENAI_API_KEY: ${JOBHUNT_OPENAI_API_KEY:-}
      # Comma-separated pool — rotates to the next key when one is exhausted/rate-limited.
      OPENAI_API_KEYS: ${JOBHUNT_OPENAI_API_KEYS:-}
      DISCORD_WEBHOOK_URL: ${JOBHUNT_DISCORD_WEBHOOK_URL}
      DISCORD_TOP_N_JOBS: ${JOBHUNT_DISCORD_TOP_N_JOBS}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      celery -A celery_app worker
      --loglevel=info
      --pool=threads
      --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy

  celery-beat:
    image: ${JOBHUNT_IMAGE}:${JOBHUNT_TAG}
    container_name: jobhunt-celery-beat
    restart: unless-stopped
    environment:
      APP_MODE: celery-beat
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${JOBHUNT_MYSQL_DATABASE}
      MYSQL_USER: ${JOBHUNT_MYSQL_USER}
      MYSQL_PASSWORD: ${JOBHUNT_MYSQL_PASSWORD}
      DJANGO_SECRET_KEY: ${JOBHUNT_DJANGO_SECRET_KEY}
      DJANGO_API_URL: http://django:8000
      APIFY_API_TOKEN: ${JOBHUNT_APIFY_API_TOKEN}
      OPENAI_API_KEY: ${JOBHUNT_OPENAI_API_KEY:-}
      # Comma-separated pool — rotates to the next key when one is exhausted/rate-limited.
      OPENAI_API_KEYS: ${JOBHUNT_OPENAI_API_KEYS:-}
      DISCORD_WEBHOOK_URL: ${JOBHUNT_DISCORD_WEBHOOK_URL}
      DISCORD_TOP_N_JOBS: ${JOBHUNT_DISCORD_TOP_N_JOBS}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
